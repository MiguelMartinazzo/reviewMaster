<div class="conteudo-login">

    <form class="conteudo-form" [formGroup]="loginForm" (submit)="submitLogin()">

<div class="logo">
    Logo
</div>

    <div>
        <div>
            <input class="input-login" placeholder="E-mail" formControlName="email" />
        </div>
        <div class="mensagem-erro" 
        *ngIf="loginForm.get('email')?.errors?.required && loginForm.get('email')?.errors?.touched" >
            Campo Obrigatório!
        </div>
        <div class="mensagem-erro" 
        *ngIf="loginForm.get('email')?.errors?.email && loginForm.get('email')?.errors?.touched ">
            formato do E-mail não é valido!
            
        </div>    
    </div>

    <div>
        <div>
            <input class="input-login" type="password" placeholder="Senha" formControlName="senha" />
        </div>
        <div class="mensagem-erro" *ngIf="loginForm.get('senha')?.errors?.required && loginForm.get('senha')?.errors?.touched" >
            Campo Obrigatório!
        </div>          
    </div>

    <div>
        <button class="input-submit" [disabled]="!loginForm.valid">
            Logar
        </button>
    </div>

    </form>
</div>
